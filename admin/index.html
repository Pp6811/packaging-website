<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoPack Studio — Content Manager</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body>
  <!-- Decap CMS (formerly Netlify CMS) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Register a custom preview style so editors see a branded preview
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap");
    CMS.registerPreviewStyle(`
      body { font-family: 'Instrument Sans', sans-serif; color: #3A3A3A; padding: 2rem; max-width: 800px; margin: 0 auto; }
      h1, h2, h3 { font-family: 'DM Serif Display', serif; color: #1A3028; }
      em { color: #C4A97D; }
      .field-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8B6F47; margin-top: 1.5rem; margin-bottom: 0.25rem; }
      .field-value { margin-bottom: 0.5rem; }
      .card { background: #F7F3EE; border: 1px solid #E0D8CC; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; }
      img { max-width: 100%; border-radius: 8px; }
    `, { raw: true });
  </script>
</body>
</html>
